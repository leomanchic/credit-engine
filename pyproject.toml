[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-engine"
version = "2.0.0"
description = "Deterministic demonstration credit decision library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "build==1.3.0", "setuptools==80.9.0", "wheel==0.45.1"]

[project.scripts]
credit-engine = "credit_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
